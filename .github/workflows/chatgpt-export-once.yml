name: ChatGPT export transcript artifact once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-export-once.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp fetched_transcript.txt artifact/fetched_transcript.txt
          printf '%s\n' "$GITHUB_RUN_ID" > workflow_run_id.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-transcript-export
          path: artifact/fetched_transcript.txt
          compression-level: 9
      - name: Save run id and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/chatgpt-export-once.yml
          git add workflow_run_id.txt
          git commit -m 'Save temporary transcript artifact run id'
          git push origin main
