name: ChatGPT fetch transcript once 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chatgpt-fetch-once2.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch transcript and diagnostics
        shell: bash
        run: |
          set +e
          URL='https://www.youtube.com/watch?v=-2l4lLszWL0'
          API='https://youtube-transcript.ai/transcript/-2l4lLszWL0.txt?lang=ru'
          : > fetched_transcript.txt
          : > fetched_transcript.vtt
          : > transcript_error.txt
          {
            echo '=== direct API ==='
            curl -v -L --retry 2 --retry-delay 2 "$API" -o fetched_transcript.txt
            echo "curl_exit=$? bytes=$(wc -c < fetched_transcript.txt)"
          } >> transcript_error.txt 2>&1

          if [ "$(wc -c < fetched_transcript.txt)" -lt 500 ]; then
            {
              echo '=== yt-dlp fallback ==='
              python -m pip install -q yt-dlp
              yt-dlp --skip-download --write-auto-subs --write-subs --sub-langs 'ru.*,ru' --sub-format vtt -o 'captions.%(ext)s' "$URL"
              echo "ytdlp_exit=$?"
            } >> transcript_error.txt 2>&1
            VTT=$(find . -maxdepth 1 -name 'captions*.vtt' | head -n 1)
            [ -n "$VTT" ] && cp "$VTT" fetched_transcript.vtt
          fi

          if [ "$(wc -c < fetched_transcript.txt)" -lt 500 ] && [ "$(wc -c < fetched_transcript.vtt)" -lt 500 ]; then
            {
              echo '=== youtube-transcript-api fallback ==='
              python -m pip install -q youtube-transcript-api
              python - <<'PY'
          from youtube_transcript_api import YouTubeTranscriptApi
          video_id = '-2l4lLszWL0'
          try:
              api = YouTubeTranscriptApi()
              fetched = api.fetch(video_id, languages=['ru'])
              with open('fetched_transcript.txt', 'w', encoding='utf-8') as f:
                  for s in fetched:
                      h = int(s.start // 3600)
                      m = int((s.start % 3600) // 60)
                      sec = int(s.start % 60)
                      f.write(f'[{h:02d}:{m:02d}:{sec:02d}] {s.text}\n')
              print('python_api_ok')
          except Exception as e:
              print('python_api_error', repr(e))
          PY
            } >> transcript_error.txt 2>&1
          fi

          echo "final_txt_bytes=$(wc -c < fetched_transcript.txt)" >> transcript_error.txt
          echo "final_vtt_bytes=$(wc -c < fetched_transcript.vtt)" >> transcript_error.txt
      - name: Save result and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/chatgpt-fetch-once2.yml
          git add fetched_transcript.txt
          git add fetched_transcript.vtt
          git add transcript_error.txt
          git commit -m 'Temporary transcript fetch result 2'
          git push origin main
